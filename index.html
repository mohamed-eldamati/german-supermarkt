<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Im Supermarkt</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#F2FAF6;--card:#FFFFFF;--ink:#1B3A35;--muted:#6B8A84;--accent:#1FA68A;--soft:#E3F4EE;--red:#E0664F;
 --der:#2F7BD0;--die:#D8543F;--das:#2E9A5F}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,Tahoma,sans-serif;padding:28px 16px 60px}
h1{text-align:center;font-size:1.6rem;margin:0 0 24px;font-weight:800}
.grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 6px 20px rgba(31,166,138,.12);display:flex;flex-direction:column}
.pic{height:230px;background:var(--soft);display:grid;place-items:center;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic svg{width:100%;height:100%;display:block}
.txt{padding:16px 16px 20px;text-align:center}
.de{font-family:"Nunito","Cairo",system-ui,sans-serif;font-weight:800;font-size:1.45rem;direction:ltr;unicode-bidi:isolate;margin:0}
.art{font-size:.8em}.der{color:var(--der)}.die{color:var(--die)}.das{color:var(--das)}
.ar{margin:4px 0 0;color:var(--muted);font-weight:700;font-size:1.05rem}
.flip img{transition:transform .8s cubic-bezier(.5,0,.2,1)}
.flip.down img{transform:rotate(180deg)}
.btn{margin-top:10px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:6px 18px;border-radius:99px;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--red);color:#fff;font-family:"Nunito",sans-serif;font-weight:800;padding:1px 12px;border-radius:99px;transition:background .4s}
.down .tag{background:var(--accent)}
@media (prefers-reduced-motion:reduce){.flip img{transition:none}}
</style>
</head>
